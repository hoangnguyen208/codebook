services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: codebook-sqlserver
    environment:
      SA_PASSWORD: YourPassword123!
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: 'false'
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - codebook-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourPassword123! -Q "SELECT 1" || exit 1
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

  # .NET API
  api:
    build:
      context: .
      dockerfile: api/CodeBook.Api/Dockerfile
    container_name: codebook-api
    ports:
      - "5000:5000"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=CodeBook;User Id=sa;Password=YourPassword123!;TrustServerCertificate=true;"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
    depends_on:
      - sqlserver
    networks:
      - codebook-network
    volumes:
      - ./api/CodeBook.Api:/app/src
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Next.js Webapp
  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: codebook-webapp
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://api:5000"
      NODE_ENV: development
    depends_on:
      - api
    networks:
      - codebook-network
    volumes:
      - ./webapp:/app/src
      - /app/src/node_modules
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  codebook-network:
    driver: bridge
